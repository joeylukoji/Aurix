name: CI
on:
  push:
  pull_request:
jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go vet ./... && go test ./... && go build ./cmd/aurixd
        working-directory: chain
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m pytest -q
        working-directory: guardian
  paypal-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m pytest -q
        working-directory: paypal-sim
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # chain/scripts/init-local.sh (used by the integration tests) needs jq.
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: pip install -r requirements-dev.txt && python -m pytest -q
        working-directory: gateway
  attestor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt && python -m pytest -q
        working-directory: attestor
  # Everything end to end: chain scripts (slashing, k-of-n attestation, hardening, governance,
  # upgrade drill) and both browser journeys on a fresh 4-validator stack (scripts/test-all.sh).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [chain, guardian, paypal-sim, gateway, attestor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: npm install -g playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: NODE_PATH="$(npm root -g)" scripts/test-all.sh
        env: { RUN_DIR: /tmp/aurix-ci }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: /tmp/aurix-ci
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chain, context: chain, file: chain/Dockerfile }
          - { name: guardian, context: guardian, file: guardian/Dockerfile }
          - { name: paypal-sim, context: paypal-sim, file: paypal-sim/Dockerfile }
          - { name: gateway, context: ., file: gateway/Dockerfile }
          - { name: attestor, context: attestor, file: attestor/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: aurix-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml config -q
