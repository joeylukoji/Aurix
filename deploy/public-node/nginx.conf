# Public AURIX node behind nginx: TLS, CORS limited to the wallet origin, rate limiting.
# Install as /etc/nginx/conf.d/aurix-node.conf; replace rpc.example.org and wallet.example.org.
# Certificates: certbot --nginx -d rpc.example.org
# aurixd keeps RPC on 127.0.0.1:26657 and REST on 127.0.0.1:1317 (enabled-unsafe-cors = false).

limit_req_zone $binary_remote_addr zone=aurix_read:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=aurix_tx:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=aurix_conn:10m;

map $http_origin $aurix_cors_origin {
    default "";
    "https://wallet.example.org" $http_origin;
}

server {
    listen 80;
    server_name rpc.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rpc.example.org;

    ssl_certificate     /etc/letsencrypt/live/rpc.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    limit_conn aurix_conn 20;
    limit_req_status 429;

    add_header Access-Control-Allow-Origin $aurix_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Vary Origin always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Tx broadcast: stricter limit.
    location = /rest/cosmos/tx/v1beta1/txs {
        limit_req zone=aurix_tx burst=5 nodelay;
        proxy_pass http://127.0.0.1:1317/cosmos/tx/v1beta1/txs;
    }

    # REST (grpc-gateway).
    location /rest/ {
        limit_req zone=aurix_read burst=40 nodelay;
        proxy_pass http://127.0.0.1:1317/;
    }

    # CometBFT RPC: allow-listed routes only (no unsafe/admin, no websocket).
    location ~ ^/rpc/(status|block|block_results|blockchain|validators|abci_info|abci_query|tx|tx_search|broadcast_tx_sync|health|net_info|commit)$ {
        limit_req zone=aurix_read burst=40 nodelay;
        rewrite ^/rpc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:26657;
    }
    location /rpc/ {
        return 403;
    }

    location / {
        return 200 "AURIX public node: /rest/* and /rpc/*\n";
    }
}
