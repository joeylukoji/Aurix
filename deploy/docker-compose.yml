name: aurix
services:
  # 4-validator AURIX testnet: chain-init writes one home per validator into the shared
  # volume (own key, equal stake, persistent peers), then chain0..chain3 each run a node.
  # BFT consensus keeps producing blocks with 3 of 4 validators up.
  chain-init:
    build: ../chain
    environment: &chain-env
      AURIX_CHAIN_ID: aurix-testnet-1
      AURIX_FAUCET_SEED: ${AURIX_FAUCET_SEED:-aurix-dev-faucet}
      AURIX_GATEWAY_SEED: ${AURIX_GATEWAY_SEED:-aurix-dev-gateway}
      # Real keys (networks/aurix-testnet-2/scripts/keygen.sh): genesis addresses instead of the dev seeds.
      AURIX_GATEWAY_ADDR: ${AURIX_GATEWAY_ADDR:-}
      AURIX_FAUCET_ADDR: ${AURIX_FAUCET_ADDR:-}
      # k-of-n PayPal proof anchoring: gateway + 2 independent attestors, 2 attestations required.
      # With real keys set ATTESTOR_ADDRS (and empty ATTESTOR_SEEDS) instead of the dev seeds.
      ATTESTOR_SEEDS: ${ATTESTOR_SEEDS-aurix-dev-attestor-1 aurix-dev-attestor-2}
      ATTESTOR_ADDRS: ${ATTESTOR_ADDRS:-}
      ANCHOR_THRESHOLD: ${ANCHOR_THRESHOLD:-2}
      AURIX_NET_HOME: /data
      VALIDATORS: "4"
      PORT_STEP: "0"
      PEER_HOST: chain%d
      BIND_HOST: 0.0.0.0
    volumes: ["chain-data:/data"]
    command: ["bash", "-c", "init-localnet.sh"]
    healthcheck: { disable: true }
    restart: "no"
  chain0: &chain-node
    build: ../chain
    environment: *chain-env
    volumes: ["chain-data:/data"]
    command: ["aurixd", "start", "--home", "/data/node0"]
    depends_on: { chain-init: { condition: service_completed_successfully } }
    ports: ["26657:26657", "1317:1317"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:26657/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  chain1:
    <<: *chain-node
    command: ["aurixd", "start", "--home", "/data/node1"]
    ports: []
  chain2:
    <<: *chain-node
    command: ["aurixd", "start", "--home", "/data/node2"]
    ports: []
  chain3:
    <<: *chain-node
    command: ["aurixd", "start", "--home", "/data/node3"]
    ports: []
  guardian:
    build: ../guardian
    # Signs every risk score (H3). Dev default key unless GUARDIAN_MNEMONIC / GUARDIAN_KEY_FILE is set
    # (required with AURIX_ENV=production).
    environment:
      AURIX_ENV: ${AURIX_ENV:-}
      GUARDIAN_MNEMONIC: ${GUARDIAN_MNEMONIC:-}
      GUARDIAN_SEED: aurix-dev-guardian-1
      GUARDIAN_CHAIN_ID: aurix-testnet-1
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
  # Second, independently keyed Neural Guardian: the gateway requires GUARDIAN_QUORUM valid signed scores.
  guardian2:
    build: ../guardian
    environment:
      AURIX_ENV: ${AURIX_ENV:-}
      GUARDIAN_MNEMONIC: ${GUARDIAN2_MNEMONIC:-}
      GUARDIAN_SEED: aurix-dev-guardian-2
      GUARDIAN_CHAIN_ID: aurix-testnet-1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
  # Local PayPal simulator. DELETE this service (and the PAYPAL_* overrides below,
  # or set them in ../.env) when switching to the real PayPal Sandbox.
  paypal-sim:
    build: ../paypal-sim
    environment:
      SIM_WEBHOOK_URL: http://gateway:8080/api/paypal/webhook
      SIM_PUBLIC_URL: ${SIM_PUBLIC_URL:-http://localhost:8090}
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/sim/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
  # SIMULATED carrier for the evidence-released USD escrow (MVP 0.2). Signs delivery events with its own key.
  delivery-sim:
    build:
      context: ..
      dockerfile: delivery-sim/Dockerfile
    environment:
      PAYMENTS_URL: http://payments:8085
      AURIX_ENV: ${AURIX_ENV:-}
      DELIVERY_SIM_KEY_FILE: ${DELIVERY_SIM_KEY_FILE:-}
    ports: ["8087:8087"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8087/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
  # PostgreSQL for the indexer (explorer read model; rebuildable from the chain at any time).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aurix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurix-dev}
      POSTGRES_DB: aurix
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurix -d aurix"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  # Indexer: follows chain0 block by block into PostgreSQL and serves /api/explorer/* (via the gateway).
  indexer:
    build:
      context: ..
      dockerfile: indexer/Dockerfile
    environment:
      CHAIN_RPC_URL: http://chain0:26657
      CHAIN_REST_URL: http://chain0:1317
      INDEXER_DATABASE_URL: postgresql://aurix:${POSTGRES_PASSWORD:-aurix-dev}@postgres:5432/aurix
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8086/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    depends_on:
      chain0: { condition: service_healthy }
      postgres: { condition: service_healthy }
  # Payments: the PayPal connector (orders, capture, webhooks) and the first PayPal-proof attestor.
  # It holds the anchor key (GATEWAY_* names: the genesis lists that address in anchor_signers).
  payments:
    build:
      context: ..
      dockerfile: payments/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      CHAIN_RPC_URL: http://chain0:26657
      CHAIN_REST_URL: http://chain0:1317
      GUARDIAN_URLS: ${GUARDIAN_URLS:-http://guardian:8000,http://guardian2:8000}
      GUARDIAN_QUORUM: ${GUARDIAN_QUORUM:-2}
      GUARDIAN_PUBKEYS: ${GUARDIAN_PUBKEYS:-}
      AURIX_ENV: ${AURIX_ENV:-}
      GATEWAY_MNEMONIC: ${GATEWAY_MNEMONIC:-}
      AURIX_GATEWAY_SEED: ${AURIX_GATEWAY_SEED:-aurix-dev-gateway}
      PAYPAL_ENV: ${PAYPAL_ENV:-simulator}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-http://paypal-sim:8090}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-sim-client-id}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-sim-client-secret}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-SIM-WEBHOOK-ID}
      # Evidence-released escrow (MVP 0.2): Ed25519 signing key and trusted source/arbiter keys.
      ESCROW_KEY_FILE: ${ESCROW_KEY_FILE:-}
      ESCROW_TRUSTED_KEYS_FILE: ${ESCROW_TRUSTED_KEYS_FILE:-}
      # AI advisor (advisory only): Gemma 4 via an OpenAI-compatible endpoint, e.g. Ollama on the host
      # (http://host.docker.internal:11434/v1). Empty = template text, no model.
      ADVISOR_LLM_URL: ${ADVISOR_LLM_URL:-}
      ADVISOR_LLM_MODEL: ${ADVISOR_LLM_MODEL:-gemma4:e4b}
      ADVISOR_LLM_API_KEY: ${ADVISOR_LLM_API_KEY:-}
    volumes: ["payments-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8085/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    depends_on:
      chain0: { condition: service_healthy }
      guardian: { condition: service_healthy }
      guardian2: { condition: service_healthy }
      # Simulator only; remove together with the paypal-sim service for real Sandbox.
      paypal-sim: { condition: service_healthy }
  # Gateway: the single public edge (wallet API, dev faucet); routes /api/explorer/* to the indexer and
  # /api/paypal/* (incl. PayPal webhooks) to payments, and serves the web wallet.
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      CHAIN_RPC_URL: http://chain0:26657
      CHAIN_REST_URL: http://chain0:1317
      INDEXER_URL: http://indexer:8086
      PAYMENTS_URL: http://payments:8085
      # H3 quorum for the advisory risk score of AUR transfers/escrows.
      GUARDIAN_URLS: ${GUARDIAN_URLS:-http://guardian:8000,http://guardian2:8000}
      GUARDIAN_QUORUM: ${GUARDIAN_QUORUM:-2}
      GUARDIAN_PUBKEYS: ${GUARDIAN_PUBKEYS:-}
      # Faucet key (dev): *_MNEMONIC / *_KEY_FILE first, seed refused with AURIX_ENV=production.
      AURIX_ENV: ${AURIX_ENV:-}
      FAUCET_MNEMONIC: ${FAUCET_MNEMONIC:-}
      AURIX_FAUCET_SEED: ${AURIX_FAUCET_SEED:-aurix-dev-faucet}
    volumes: ["gateway-data:/data"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/api/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    depends_on:
      chain0: { condition: service_healthy }
      guardian: { condition: service_healthy }
      guardian2: { condition: service_healthy }
      indexer: { condition: service_healthy }
      payments: { condition: service_healthy }
  # Independent PayPal attestors (k-of-n anchoring): each re-checks the capture at PayPal with its own
  # key and read-only credentials, through a different chain node. Real keys: ATTESTORn_MNEMONIC.
  attestor1: &attestor
    build: ../attestor
    environment:
      AURIX_ENV: ${AURIX_ENV:-}
      ATTESTOR_SEED: aurix-dev-attestor-1
      ATTESTOR_MNEMONIC: ${ATTESTOR1_MNEMONIC:-}
      CHAIN_REST: http://chain1:1317
      CHAIN_ID: aurix-testnet-1
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-http://paypal-sim:8090}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-sim-client-id}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-sim-client-secret}
      POLL_INTERVAL: "2"
    depends_on:
      chain1: { condition: service_healthy }
      paypal-sim: { condition: service_healthy }
    restart: unless-stopped
  attestor2:
    <<: *attestor
    environment:
      AURIX_ENV: ${AURIX_ENV:-}
      ATTESTOR_SEED: aurix-dev-attestor-2
      ATTESTOR_MNEMONIC: ${ATTESTOR2_MNEMONIC:-}
      CHAIN_REST: http://chain2:1317
      CHAIN_ID: aurix-testnet-1
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-http://paypal-sim:8090}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-sim-client-id}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-sim-client-secret}
      POLL_INTERVAL: "2"
    depends_on:
      chain2: { condition: service_healthy }
      paypal-sim: { condition: service_healthy }
volumes:
  chain-data:
  postgres-data:
  payments-data:
  gateway-data:
