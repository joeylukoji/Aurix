name: aurix
services:
  # 4-validator AURIX testnet: chain-init writes one home per validator into the shared
  # volume (own key, equal stake, persistent peers), then chain0..chain3 each run a node.
  # BFT consensus keeps producing blocks with 3 of 4 validators up.
  chain-init:
    build: ../chain
    environment: &chain-env
      AURIX_CHAIN_ID: aurix-testnet-1
      AURIX_FAUCET_SEED: ${AURIX_FAUCET_SEED:-aurix-dev-faucet}
      AURIX_GATEWAY_SEED: ${AURIX_GATEWAY_SEED:-aurix-dev-gateway}
      AURIX_NET_HOME: /data
      VALIDATORS: "4"
      PORT_STEP: "0"
      PEER_HOST: chain%d
      BIND_HOST: 0.0.0.0
    volumes: ["chain-data:/data"]
    command: ["bash", "-c", "init-localnet.sh"]
    healthcheck: { disable: true }
    restart: "no"
  chain0: &chain-node
    build: ../chain
    environment: *chain-env
    volumes: ["chain-data:/data"]
    command: ["aurixd", "start", "--home", "/data/node0"]
    depends_on: { chain-init: { condition: service_completed_successfully } }
    ports: ["26657:26657", "1317:1317"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:26657/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  chain1:
    <<: *chain-node
    command: ["aurixd", "start", "--home", "/data/node1"]
    ports: []
  chain2:
    <<: *chain-node
    command: ["aurixd", "start", "--home", "/data/node2"]
    ports: []
  chain3:
    <<: *chain-node
    command: ["aurixd", "start", "--home", "/data/node3"]
    ports: []
  guardian:
    build: ../guardian
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
  # Local PayPal simulator. DELETE this service (and the PAYPAL_* overrides below,
  # or set them in ../.env) when switching to the real PayPal Sandbox.
  paypal-sim:
    build: ../paypal-sim
    environment:
      SIM_WEBHOOK_URL: http://gateway:8080/api/paypal/webhook
      SIM_PUBLIC_URL: ${SIM_PUBLIC_URL:-http://localhost:8090}
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/sim/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      CHAIN_RPC_URL: http://chain0:26657
      CHAIN_REST_URL: http://chain0:1317
      GUARDIAN_URL: http://guardian:8000
      AURIX_FAUCET_SEED: ${AURIX_FAUCET_SEED:-aurix-dev-faucet}
      AURIX_GATEWAY_SEED: ${AURIX_GATEWAY_SEED:-aurix-dev-gateway}
      PAYPAL_ENV: ${PAYPAL_ENV:-simulator}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-http://paypal-sim:8090}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-sim-client-id}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-sim-client-secret}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-SIM-WEBHOOK-ID}
    volumes: ["gateway-data:/data"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/api/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    depends_on:
      chain0: { condition: service_healthy }
      guardian: { condition: service_healthy }
      # Simulator only; remove together with the paypal-sim service for real Sandbox.
      paypal-sim: { condition: service_healthy }
volumes:
  chain-data:
  gateway-data:
