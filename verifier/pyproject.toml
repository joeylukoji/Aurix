[project]
name = "aurix-verify"
version = "0.2.0"
description = "Independent offline verifier for AURIX proof packages"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.scripts]
aurix-verify = "aurix_verify.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aurix_verify"]
