syntax = "proto3";
package aurix.smartmoney.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/joeylukoji/aurix/chain/x/smartmoney/types";

enum EscrowStatus {
  option (gogoproto.goproto_enum_prefix) = false;
  ESCROW_STATUS_UNSPECIFIED = 0;
  ESCROW_STATUS_LOCKED = 1;
  ESCROW_STATUS_RELEASED = 2;
  ESCROW_STATUS_REFUNDED = 3;
}

message Escrow {
  uint64 id = 1;
  string sender = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string recipient = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string arbiter = 4;
  cosmos.base.v1beta1.Coin amount = 5 [(gogoproto.nullable) = false];
  int64 deadline_height = 6;
  EscrowStatus status = 7;
  int64 created_height = 8;
}

enum ProofStatus {
  option (gogoproto.goproto_enum_prefix) = false;
  PROOF_STATUS_UNSPECIFIED = 0;
  PROOF_STATUS_PENDING = 1;
  PROOF_STATUS_CONFIRMED = 2;
}

// PaymentProof is a k-of-n attested proof of an external (PayPal) payment.
message PaymentProof {
  // hex sha256(order_id|capture_id), lowercase
  string hash = 1;
  // PayPal order id
  string external_ref = 2;
  // height of the first attestation (kept for compatibility)
  int64 height = 3;
  // first attestor (kept for compatibility)
  string submitter = 4;
  ProofStatus status = 5;
  // attestor addresses, in order
  repeated string attestations = 6;
  // PayPal capture id
  string capture_ref = 7;
  int64 first_seen_height = 8;
  // 0 while pending
  int64 confirmed_height = 9;
  // payment amount as decimal string (e.g. "12.50")
  string amount = 10;
  // ISO 4217 currency (e.g. "USD")
  string currency = 11;
  // pending proofs are deleted at this height (0 = never)
  int64 expires_height = 12;
}

message Params {
  // Addresses (e.g. the API gateway) allowed to anchor external payment proofs.
  repeated string anchor_signers = 1;
  // Number of distinct attestations required to confirm a proof.
  uint32 anchor_threshold = 2;
  // Blocks after which a PENDING proof is deleted (0 = never expire).
  uint64 pending_ttl_blocks = 3;
}
